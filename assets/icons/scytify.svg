  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <circle cx="256" cy="256" r="188" fill="url(#well)"/>
  <circle cx="256" cy="256" r="187" fill="none" stroke="url(#well-rim)" stroke-width="3"/>
  <g fill="none" stroke="#1ED760" stroke-width="32" stroke-linecap="round" opacity="0.4" filter="url(#glow)">
    <path d="M 148 224 V 288"/>
    <path d="M 202 184 V 328"/>
    <path d="M 256 150 V 362"/>
    <path d="M 310 190 V 322"/>
    <path d="M 364 230 V 282"/>
  </g>
  <g fill="none" stroke="url(#bar)" stroke-width="32" stroke-linecap="round">
    <path d="M 148 224 V 288"/>
    <path d="M 202 184 V 328"/>
    <path d="M 256 150 V 362"/>
    <path d="M 310 190 V 322"/>
    <path d="M 364 230 V 282"/>
