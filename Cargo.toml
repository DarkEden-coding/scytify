[package]
name = "custom-spotify"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "io-util"] }
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "wayland", "x11", "tokio", "image-without-codecs", "advanced"] }
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = "1.0"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
url = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "0.39", features = ["bundled"] }
directories = "6.0"
keyring = { version = "4.2.0", default-features = false, features = ["v1", "zbus-secret-service-keyring-store"] }
librespot-oauth = { version = "=0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
librespot-protocol = "=0.8.0"
librespot-connect = { version = "=0.8.0", default-features = false }
librespot-playback = { version = "0.8.0", default-features = false, features = ["alsa-backend", "rustls-tls-native-roots"] }
open = "5.3"
mpris-server = { version = "0.10.0", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
librespot-oauth = { path = "vendor/librespot-oauth" }

[workspace]
members = ["vendor/librespot-oauth"]
default-members = [".", "vendor/librespot-oauth"]
